<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MKS Race Tracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b0b10;
      color: #f5f5f5;
    }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #252545 0, #050508 50%);
      color: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 1rem;
      margin: 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .pill-group {
      display: inline-flex;
      border-radius: 999px;
      border: 1px solid #444;
      overflow: hidden;
    }
    .pill {
      border: none;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      background: transparent;
      color: #ccc;
      cursor: pointer;
    }
    .pill.active {
      background: linear-gradient(135deg, #ff5e5e, #ffb347);
      color: #111;
      font-weight: 600;
    }
    .pill:not(.active):hover {
      background: rgba(255, 255, 255, 0.06);
    }
    main {
      flex: 1;
      padding: 0.75rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
    }
    .section {
      margin-bottom: 1rem;
    }
    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.7;
      margin-bottom: 0.4rem;
    }
    .card {
      background: rgba(0, 0, 0, 0.5);
      border-radius: 0.75rem;
      padding: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.4);
    }
    .setup-form {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    label {
      font-size: 0.85rem;
      opacity: 0.85;
    }
    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid #444;
      background: rgba(0, 0, 0, 0.8);
      color: #f5f5f5;
      font-size: 0.9rem;
      box-sizing: border-box;
    }
    input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }
    button.primary,
    button.secondary,
    button.ghost {
      border-radius: 999px;
      border: none;
      padding: 0.45rem 0.9rem;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }
    button.primary {
      background: linear-gradient(135deg, #ff5e5e, #ffb347);
      color: #111;
      font-weight: 600;
    }
    button.primary:disabled {
      opacity: 0.6;
      cursor: default;
    }
    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #f5f5f5;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    button.ghost {
      background: transparent;
      color: #ddd;
      border: 1px dashed rgba(255, 255, 255, 0.2);
    }
    button.secondary:hover:not(:disabled),
    button.ghost:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.12);
    }
    .setup-mode-buttons {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .setup-mode-buttons button {
      flex: 1;
      min-width: 120px;
    }
    .players-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .player-tile {
      border-radius: 0.75rem;
      padding: 0.6rem 0.7rem;
      background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.08), rgba(0, 0, 0, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      transition: transform 0.08s ease, box-shadow 0.1s ease, border-color 0.1s ease;
    }
    .player-tile:hover {
      transform: translateY(-1px);
      box-shadow: 0 0.5rem 1.1rem rgba(0, 0, 0, 0.6);
      border-color: rgba(255, 255, 255, 0.25);
    }
    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
    }
    .player-name {
      font-weight: 600;
      font-size: 0.95rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .player-pos {
      font-weight: 700;
      font-size: 1rem;
    }
    .player-meta {
      font-size: 0.7rem;
      opacity: 0.7;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .movement-panel {
      position: sticky;
      bottom: 0;
      margin-top: 0.75rem;
      z-index: 9;
    }
    .movement-inner {
      background: rgba(5, 5, 10, 0.96);
      border-radius: 1rem 1rem 0 0;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 0.7rem 0.75rem 0.75rem;
      box-shadow: 0 -0.5rem 1.2rem rgba(0, 0, 0, 0.8);
    }
    .movement-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      opacity: 0.7;
      margin-bottom: 0.2rem;
    }
    .movement-main {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .movement-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .movement-row strong {
      font-size: 0.9rem;
    }
    .movement-delta-input {
      max-width: 90px;
    }
    .quick-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .quick-buttons button {
      font-size: 0.75rem;
      padding-inline: 0.55rem;
      padding-block: 0.25rem;
    }
    .movement-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .dice-panel {
      margin-top: 0.75rem;
    }
    .dice-buttons {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.4rem;
    }
    .dice-output {
      font-size: 0.9rem;
      min-height: 1.4rem;
      opacity: 0.9;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.1rem 0.4rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.8;
    }
    .tag-dot {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #ffb347;
    }
    .top-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .spacer {
      flex: 1;
    }
    @media (max-width: 600px) {
      header h1 {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>MKS Race Tracker</h1>
    <div class="pill-group" id="modePills">
      <button class="pill active" data-mode="table">Table</button>
      <button class="pill" data-mode="single">Single</button>
    </div>
  </header>

  <main>
    <!-- Setup section -->
    <section id="setupSection" class="section">
      <div class="section-title">Setup</div>
      <div class="card">
        <div class="setup-form" id="setupForm">
          <div class="setup-mode-buttons">
            <button class="secondary" id="setupTableBtn">Setup Table Game</button>
            <button class="secondary" id="setupSingleBtn">Setup Single Player</button>
          </div>
          <div id="tableSetupFields" style="display:none;">
            <label>
              Add player
              <input type="text" id="newPlayerName" placeholder="Driver name (e.g. Comet)" />
            </label>
            <button class="ghost" id="addPlayerBtn">+ Add Player</button>
            <div style="font-size:0.8rem; opacity:0.7;" id="playerCountHint">
              No players added yet.
            </div>
          </div>
          <div id="singleSetupFields" style="display:none;">
            <label>
              Player name
              <input type="text" id="singlePlayerName" placeholder="Your name" />
            </label>
          </div>
          <div style="display:flex; gap:0.5rem; margin-top:0.25rem;">
            <button class="primary" id="startGameBtn" disabled>Start Tracking</button>
            <button class="secondary" id="resetStateBtn">Reset</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Active game section -->
    <section id="gameSection" class="section" style="display:none;">
      <div class="section-title">Race Positions</div>
      <div class="top-controls">
        <div class="pill-group" id="viewPills">
          <button class="pill active" data-view="list">List</button>
          <button class="pill" data-view="grid">Grid</button>
        </div>
        <div class="spacer"></div>
        <button class="secondary" id="restartRaceBtn">Restart Race</button>
        <button class="secondary" id="newGameBtn">New Game</button>
        <button class="secondary" id="diceToggleBtn">Dice Tools</button>
      </div>
      <div class="card">
        <div id="playersContainer"></div>

        <div id="dicePanel" class="dice-panel" style="display:none;">
          <div class="section-title" style="margin-top:0;">Dice</div>
          <div class="dice-buttons">
            <button class="secondary" id="rollD6Btn">Roll d6</button>
            <button class="secondary" id="rollD20Btn">Roll d20</button>
          </div>
          <div class="dice-output" id="diceOutput">No rolls yet.</div>
        </div>
      </div>

      <div id="movementPanel" class="movement-panel" style="display:none;">
        <div class="movement-inner">
          <div class="movement-title">Adjust Position</div>
          <div class="movement-main">
            <div class="movement-row">
              <strong id="movementPlayerName">Player</strong>
              <span id="movementPlayerPos" style="font-size:0.85rem; opacity:0.8;"></span>
            </div>
            <div class="movement-row">
              <label style="flex:1; max-width:220px;">
                Δ Position (use negative to move backwards)
                <input type="number" id="deltaInput" class="movement-delta-input" value="0" />
              </label>
              <div class="quick-buttons">
                <button class="secondary" data-delta="+1">+1</button>
                <button class="secondary" data-delta="+2">+2</button>
                <button class="secondary" data-delta="+3">+3</button>
                <button class="secondary" data-delta="+5">+5</button>
                <button class="secondary" data-delta="-1">-1</button>
                <button class="secondary" data-delta="-2">-2</button>
                <button class="secondary" data-delta="-5">-5</button>
              </div>
            </div>
            <div class="movement-actions">
              <button class="primary" id="applyDeltaBtn">Apply</button>
              <button class="ghost" id="cancelMovementBtn">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // --- State management ---
    const STORAGE_KEY = "mks_race_tracker_state_v1";

    let state = {
      mode: "table",          // "table" | "single"
      players: [],            // {id, name, position}
      view: "list",           // "list" | "grid"
      selectedPlayerId: null
    };

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.warn("Could not save state", e);
      }
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.players)) {
          state = {
            mode: parsed.mode || "table",
            players: parsed.players,
            view: parsed.view || "list",
            selectedPlayerId: null
          };
        }
      } catch (e) {
        console.warn("Could not load state", e);
      }
    }

    // --- DOM helpers ---
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => Array.from(document.querySelectorAll(sel));

    const setupSection = $("#setupSection");
    const gameSection = $("#gameSection");
    const playersContainer = $("#playersContainer");

    const modePills = $("#modePills");
    const viewPills = $("#viewPills");
    const diceToggleBtn = $("#diceToggleBtn");
    const dicePanel = $("#dicePanel");
    const diceOutput = $("#diceOutput");

    const setupTableBtn = $("#setupTableBtn");
    const setupSingleBtn = $("#setupSingleBtn");
    const tableSetupFields = $("#tableSetupFields");
    const singleSetupFields = $("#singleSetupFields");

    const newPlayerNameInput = $("#newPlayerName");
    const addPlayerBtn = $("#addPlayerBtn");
    const playerCountHint = $("#playerCountHint");
    const singlePlayerNameInput = $("#singlePlayerName");

    const startGameBtn = $("#startGameBtn");
    const resetStateBtn = $("#resetStateBtn");

    const movementPanel = $("#movementPanel");
    const movementPlayerName = $("#movementPlayerName");
    const movementPlayerPos = $("#movementPlayerPos");
    const deltaInput = $("#deltaInput");
    const applyDeltaBtn = $("#applyDeltaBtn");
    const cancelMovementBtn = $("#cancelMovementBtn");

    const rollD6Btn = $("#rollD6Btn");
    const rollD20Btn = $("#rollD20Btn");

    const restartRaceBtn = $("#restartRaceBtn");
    const newGameBtn = $("#newGameBtn");

    // --- Rendering ---
    function renderSetup() {
      // mode pills
      $$("#modePills .pill").forEach((p) => {
        p.classList.toggle("active", p.dataset.mode === state.mode);
      });

      // show relevant setup fields
      if (state.mode === "table") {
        tableSetupFields.style.display = "";
        singleSetupFields.style.display = "none";
      } else {
        tableSetupFields.style.display = "none";
        singleSetupFields.style.display = "";
      }

      if (state.mode === "single" && state.players.length === 1) {
        singlePlayerNameInput.value = state.players[0].name || "";
      }

      // start button availability
      if (state.mode === "table") {
        startGameBtn.disabled = state.players.length === 0;
        playerCountHint.textContent =
          state.players.length === 0
            ? "No players added yet."
            : `Players: ${state.players.map((p) => p.name).join(", ")}`;
      } else {
        startGameBtn.disabled = !singlePlayerNameInput.value.trim();
      }
    }

    function renderGame() {
      if (state.players.length === 0) {
        gameSection.style.display = "none";
        return;
      }
      gameSection.style.display = "";

      // view pills
      $$("#viewPills .pill").forEach((p) => {
        p.classList.toggle("active", p.dataset.view === state.view);
      });

      // render players
      playersContainer.innerHTML = "";

      const container =
        state.view === "list"
          ? document.createElement("div")
          : document.createElement("div");
      container.className =
        state.view === "list" ? "players-list" : "players-grid";

      state.players.forEach((player) => {
        const tile = document.createElement("div");
        tile.className = "player-tile";
        tile.dataset.playerId = player.id;

        const header = document.createElement("div");
        header.className = "player-header";

        const nameEl = document.createElement("div");
        nameEl.className = "player-name";
        nameEl.textContent = player.name || "Driver";

        const posEl = document.createElement("div");
        posEl.className = "player-pos";
        posEl.textContent = player.position;

        header.appendChild(nameEl);
        header.appendChild(posEl);

        const meta = document.createElement("div");
        meta.className = "player-meta";

        const tag = document.createElement("span");
        tag.className = "tag";
        const dot = document.createElement("span");
        dot.className = "tag-dot";
        const label = document.createElement("span");
        label.textContent = "Position";
        tag.appendChild(dot);
        tag.appendChild(label);

        meta.appendChild(tag);

        tile.appendChild(header);
        tile.appendChild(meta);

        tile.addEventListener("click", () => openMovementPanel(player.id));

        container.appendChild(tile);
      });

      playersContainer.appendChild(container);
    }

    function renderAll() {
      renderSetup();
      renderGame();
    }

    // --- Movement panel logic ---
    function openMovementPanel(playerId) {
      const player = state.players.find((p) => p.id === playerId);
      if (!player) return;
      state.selectedPlayerId = playerId;
      movementPlayerName.textContent = player.name;
      movementPlayerPos.textContent = `Current Position: ${player.position}`;
      deltaInput.value = 0;
      movementPanel.style.display = "";
    }

    function closeMovementPanel() {
      state.selectedPlayerId = null;
      movementPanel.style.display = "none";
    }

    function applyDelta() {
      const id = state.selectedPlayerId;
      if (!id) return;
      const player = state.players.find((p) => p.id === id);
      if (!player) return;

      const delta = parseInt(deltaInput.value, 10);
      if (isNaN(delta) || delta === 0) {
        closeMovementPanel();
        return;
      }
      player.position += delta;
      saveState();
      renderGame();
      closeMovementPanel();
    }

    // --- Dice ---
    function rollDie(sides) {
      return Math.floor(Math.random() * sides) + 1;
    }

    function handleRollD6() {
      const v = rollDie(6);
      diceOutput.textContent = `d6 → ${v}`;
    }

    function handleRollD20() {
      const v = rollDie(20);
      diceOutput.textContent = `d20 → ${v}`;
    }

    // --- Restart/New Game helpers ---
    function restartRace() {
      if (!state.players.length) return;
      if (!confirm("Restart race? All positions will reset to 0.")) return;

      state.players.forEach(p => p.position = 0);
      saveState();
      renderGame();
    }

    function newGame() {
      if (!confirm("Start a new game? All players and data will be cleared.")) return;

      state = {
        mode: "table",
        players: [],
        view: "list",
        selectedPlayerId: null
      };
      saveState();
      setupSection.style.display = "";
      gameSection.style.display = "none";
      renderAll();
    }

    // --- Event wiring ---
    function init() {
      loadState();
      renderAll();

      // Mode pills
      modePills.addEventListener("click", (e) => {
        const btn = e.target.closest(".pill");
        if (!btn) return;
        const mode = btn.dataset.mode;
        if (!mode) return;
        state.mode = mode;
        if (mode === "single" && state.players.length > 1) {
          // wipe players if coming from table multi
          state.players = [];
        }
        saveState();
        renderAll();
      });

      // View pills
      viewPills.addEventListener("click", (e) => {
        const btn = e.target.closest(".pill");
        if (!btn) return;
        const view = btn.dataset.view;
        if (!view) return;
        state.view = view;
        saveState();
        renderGame();
      });

      // Setup mode buttons
      setupTableBtn.addEventListener("click", () => {
        state.mode = "table";
        saveState();
        renderAll();
      });
      setupSingleBtn.addEventListener("click", () => {
        state.mode = "single";
        saveState();
        renderAll();
      });

      // Add player
      addPlayerBtn.addEventListener("click", () => {
        const name = newPlayerNameInput.value.trim();
        if (!name) return;
        state.players.push({
          id: "p_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6),
          name,
          position: 0
        });
        newPlayerNameInput.value = "";
        saveState();
        renderSetup();
        renderGame();
      });

      // Start game
      startGameBtn.addEventListener("click", () => {
        if (state.mode === "single") {
          const name = singlePlayerNameInput.value.trim() || "Player";
          state.players = [
            {
              id: "p_single",
              name,
              position: 0
            }
          ];
        } else if (state.players.length === 0) {
          return;
        }
        saveState();
        setupSection.style.display = "none";
        gameSection.style.display = "";
        renderGame();
      });

      // Reset state (hard reset from setup)
      resetStateBtn.addEventListener("click", () => {
        if (!confirm("Clear all players and positions?")) return;
        state = {
          mode: "table",
          players: [],
          view: "list",
          selectedPlayerId: null
        };
        saveState();
        setupSection.style.display = "";
        gameSection.style.display = "none";
        renderAll();
      });

      // Dice
      diceToggleBtn.addEventListener("click", () => {
        const visible = dicePanel.style.display !== "none";
        dicePanel.style.display = visible ? "none" : "";
      });
      rollD6Btn.addEventListener("click", handleRollD6);
      rollD20Btn.addEventListener("click", handleRollD20);

      // Movement panel
      applyDeltaBtn.addEventListener("click", applyDelta);
      cancelMovementBtn.addEventListener("click", closeMovementPanel);

      // Quick delta buttons
      movementPanel.addEventListener("click", (e) => {
        const btn = e.target.closest("button.secondary");
        if (!btn || !btn.dataset.delta) return;
        const val = parseInt(btn.dataset.delta, 10);
        if (isNaN(val)) return;
        deltaInput.value = val;
      });

      // Restart / New game
      restartRaceBtn.addEventListener("click", restartRace);
      newGameBtn.addEventListener("click", newGame);

      // If we loaded players, skip straight to game
      if (state.players.length > 0) {
        setupSection.style.display = "none";
        gameSection.style.display = "";
        renderGame();
      }
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
</html>
